name: Python 3.10.12 and 3.14 with Neo4j

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    # The exact legacy 3.10.12 runtime has a setup-python build for Ubuntu 22.04.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10.12", "3.14"]
    timeout-minutes: 10
    services:
      neo4j:
        image: neo4j:2026.09.0
        env:
          # Disposable CI database; this is not an application secret.
          NEO4J_AUTH: neo4j/ci-only-lab-password
          NEO4J_server_memory_heap_initial__size: 256m
          NEO4J_server_memory_heap_max__size: 512m
          NEO4J_server_memory_pagecache_size: 256m
        ports:
          - 7687:7687
        options: >-
          --health-cmd "cypher-shell -u neo4j -p ci-only-lab-password 'RETURN 1;'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://127.0.0.1:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ci-only-lab-password
      NEO4J_DATABASE: neo4j
      NEO4J_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Prepare wheels for offline installation
        run: |
          python -m pip download --only-binary=:all: --dest .test-artifacts/wheels -r requirements.txt
      - name: Install only from the wheel bundle
        run: python -m pip install --no-index --find-links .test-artifacts/wheels -r requirements.txt
      - run: python -m pip check
      - run: python manage.py check
      - run: python manage.py test --verbosity 2
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - run: node --test tests/test_graphrag_freshness.mjs
      - run: |
          node --check graphlab/static/graphlab/graphrag.js
          node --check graphlab/static/graphlab/documents.js
          node --check graphlab/static/graphlab/documents_manage.js
